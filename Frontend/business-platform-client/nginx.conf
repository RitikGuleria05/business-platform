
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

##Your React app uses React Router. If someone refreshes a URL such as /products, Nginx must serve index.html so React Router can handle that route. Otherwise, the server may return a 404.